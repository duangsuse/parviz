<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>parviz · p5 — Lisp 写 p5.js</title>
<style>
:root{--B:#61afef;--Y:#e5c07b;--G:#98c379;--R:#e06c75;--P:#c678dd;--bg:#1e2127;--bg2:#252932;--fg:#d7dae0;--mut:#7f8794;--bd:#3a3f4b}
*{box-sizing:border-box}
body{margin:0;height:100vh;display:flex;flex-direction:column;background:var(--bg);color:var(--fg);font:13px/1.55 ui-monospace,"JetBrains Mono",Menlo,Consolas,monospace;font-variant-ligatures:none}
a{color:var(--B);text-decoration:none}
header{display:flex;gap:10px;align-items:center;padding:4px 10px;border-bottom:1px solid var(--bd);color:var(--mut);font-size:12px;flex-wrap:wrap}
header b{color:var(--fg)}
button,select{background:#2f3440;color:var(--fg);border:1px solid var(--bd);border-radius:3px;font:inherit;padding:1px 8px;cursor:pointer}
button:hover,select:hover{border-color:var(--B)}
#play{color:var(--G)} #resume{color:var(--Y);border-color:var(--Y)} #rate{color:var(--mut);font-variant-numeric:tabular-nums;min-width:12ch;text-align:right}
#status{margin-left:auto}
main{flex:1;display:flex;min-height:0}
#left{flex:0 0 52%;display:flex;flex-direction:column;min-width:0;border-right:1px solid var(--bd)}
#right{flex:1;display:flex;flex-direction:column;min-width:0}
.tab{padding:2px 12px;background:var(--bg2);border-bottom:1px solid var(--bd);color:var(--mut);font-size:12px}
#rtab{display:flex;align-items:center;gap:10px}
#rtab button{padding:0 6px;font-size:12px;font-variant-numeric:tabular-nums}
#fb{flex:1;max-width:320px;height:10px;position:relative;background:#14161b;border:1px solid var(--bd);border-radius:3px;cursor:pointer;overflow:hidden}
#fb:hover,#fb:focus{border-color:var(--B);outline:none}
#fb i{position:absolute;left:0;top:0;bottom:0;width:0;background:#2b3a55}
#fb u{position:absolute;top:0;bottom:0;width:3px;background:var(--Y);display:none}
#fblive{color:var(--Y);border-color:var(--Y)}
#fbinfo{flex:none;height:160px;min-height:48px;max-height:75%;resize:vertical;overflow:auto;background:var(--bg2);border-bottom:1px solid var(--bd);padding:4px 10px;font-size:12px;white-space:pre-wrap;word-break:break-all}
#fbinfo .hd{color:var(--Y)} #fbinfo .calls{margin-bottom:4px} #fbinfo .call{display:inline-block;margin:0 10px 0 0;color:var(--B);cursor:pointer} #fbinfo .call:hover{background:#2b3a55}
#tp{flex:none;background:var(--bg2);border-bottom:1px solid var(--bd);font-size:12px;max-height:45%;overflow:auto}
#tp>summary{cursor:pointer;padding:2px 12px;color:var(--mut);position:sticky;top:0;background:var(--bg2);z-index:1;white-space:nowrap}
#tp>summary select{width:8em;padding:0 2px;font-size:12px;margin-left:6px;vertical-align:baseline}
#tpbar{display:flex;gap:6px;padding:2px 12px;align-items:center} #tpbar button{padding:0 6px;font-size:12px}
#tpimp{width:12em;background:#2f3440;color:var(--fg);border:1px solid var(--bd);border-radius:3px;font:inherit;font-size:12px;padding:0 4px}
#tplinks a{color:var(--B);margin-right:4px;text-decoration:none;border-bottom:1px dotted var(--B)} #tplinks a.on{color:var(--Y);border-color:var(--Y)}
#tprows{padding:2px 12px}
#tprows .row{display:flex;align-items:center;gap:6px;min-height:22px}
#tprows .lb{flex:0 0 12em;color:var(--B);cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#tprows input[type=number]{width:72px;background:#2f3440;color:var(--fg);border:1px solid var(--bd);border-radius:3px;font:inherit;padding:0 4px} #tprows input[type=color]{width:40px;height:20px;padding:0;border:1px solid var(--bd);background:none}
#tprows .empty{color:var(--mut)}
#tphead{padding:2px 12px} #tphead summary{cursor:pointer;color:var(--mut)} #tphead pre{color:var(--mut);white-space:pre-wrap;margin:2px 0}
#pv.view>canvas:not(.fbv){display:none}
.tab b{color:var(--fg);font-weight:normal;border-bottom:2px solid var(--B)}
pre{margin:0}
.ed{outline:none;white-space:pre-wrap;word-break:break-all;overflow:auto;padding:8px 10px;tab-size:2;caret-color:#fff}
.ed::after{content:'\200b'}
#src{flex:1;min-height:80px;font-size:14px}
#split{height:5px;cursor:row-resize;background:var(--bd);flex:none}
#split:hover,#split.drag{background:var(--B)}
#con{flex:0 0 28%;display:flex;flex-direction:column;min-height:60px}
#con .hd{display:flex;align-items:center;gap:8px;padding:1px 10px;background:var(--bg2);border-bottom:1px solid var(--bd);color:var(--mut);font-size:12px}
#con .hd button{margin-left:auto;padding:0 6px}
#out{flex:1;overflow:auto;padding:4px 10px;white-space:pre-wrap;word-break:break-all;font-size:12px}
#out .log{color:var(--fg)} #out .info{color:var(--B)} #out .warn{color:var(--Y)} #out .cm{color:var(--mut)}
#out .eitem,#out .error{display:block;color:var(--R)}
#out .eitem{cursor:pointer} #out .eitem:hover{background:#3a2a2e}

#pv{flex:1;display:flex;align-items:center;justify-content:center;overflow:auto;background:#14161b;padding:8px}
#pv canvas{box-shadow:0 2px 14px #0009}
#pv {
  background-image: radial-gradient(rgba(201, 202, 207, 0.08) 1px, rgba(0, 0, 0, 0) 0px), radial-gradient(rgba(201, 202, 207, 0.04) 1px, rgba(0, 0, 0, 0) 0px);
  background-size: 32px 32px, 8px 8px;
  background-position: center;
}
/* 全屏 sloc 层：错误角标 + 控制台行到源码的连线（与 index.html 同一套，见 ui/sloc.js） */
#ov{position:fixed;inset:0;pointer-events:none;z-index:20}
#ov svg{position:absolute;inset:0;width:100%;height:100%}
#ov g path{fill:none;stroke:var(--B);stroke-width:1.4;stroke-dasharray:4 3}
#ov g path.ar{stroke:var(--G);stroke-width:1.8;stroke-dasharray:none}
#ov g path.ah{fill:var(--G);stroke:none}
#ov path.e{stroke:var(--R)}
.mk{position:fixed;pointer-events:auto;font-size:9px;line-height:1;padding:0 2px;border-radius:2px;background:#2b3a55;color:var(--B);cursor:pointer;transform:translateY(-100%);white-space:nowrap}
.mk.e{background:#4a2a2e;color:var(--R)}
.B{color:var(--B)}.Y{color:var(--Y)}.G{color:var(--G)}.P{color:var(--P)}.R{color:var(--R)}
::highlight(ev){background-color:rgba(229,192,123,.35)}
::highlight(det){background-color:rgba(249,226,175,.28);text-decoration:underline var(--Y)}
::highlight(bp){background-color:rgba(224,108,117,.30);text-decoration:underline dotted var(--R)}
::highlight(tw-pos){background-color:rgba(198,120,221,.16);text-decoration:underline dotted var(--P)}
::highlight(tw-enum){background-color:rgba(97,175,239,.14);text-decoration:underline dotted var(--B)}
::highlight(tw-on){background-color:rgba(152,195,121,.22);text-decoration:underline var(--G)}
::highlight(tw-off){background-color:rgba(224,108,117,.22);text-decoration:underline var(--R)}
::highlight(tw-dim){color:var(--mut)}
::highlight(tw-btn){background-color:rgba(152,195,121,.16);text-decoration:underline var(--G)}
#tw{position:fixed;z-index:60;display:none;background:var(--bg2);border:1px solid var(--bd);border-radius:6px;padding:6px;box-shadow:0 6px 24px #000a;font-size:12px;color:var(--mut)}
#tw canvas{display:block;cursor:crosshair;border-radius:3px}
/* 目录树（Ctrl+E）：左侧浮层，不挤压画布 */
#tw .row{display:flex;align-items:center;gap:8px;color:var(--fg)}
#tw input[type=color]{width:64px;height:30px;padding:0;border:1px solid var(--bd);border-radius:3px;background:none;cursor:pointer}
#tw div:not(.row){margin-top:4px}
@media (max-width:900px){main{flex-direction:column}#left{flex:1 1 55%;border-right:0}}
</style>
<link rel="stylesheet" href="ui/pause.css"><link rel="stylesheet" href="ui/explorer.css">
<style id="hlc"></style>
<style id="twst"></style>
</head>
<body>
<header>
  <b><a href="./index.html">parviz</a> × p5</b>
  <button id="play" title="运行（Ctrl+Enter）：toplevel 语句 = setup，tick.{ } 每个重画帧跑，see.{ } 固定 20 Hz 物理帧">▶ 运行</button>
  <button id="rate" title="fps：画布每秒重画次数（p.draw）· Hz：see 物理帧每秒次数（frameRate 60 20 的第二个数）。点击：在 0 fps（停止重画）与 frameRate 的值（默认 60）之间切换。停止：Ctrl+Shift+Enter">— fps · — Hz</button>
  <button id="resume" title="断点处继续（F9 继续 · F10 下一行 · F8 取消断点并继续 · F11 下一帧）" hidden>⏯ 继续</button>
  <button id="pmode"></button>
  <button id="files" title="打开文件夹（Ctrl+E）· Ctrl+S 保存">🗀 文件夹</button>
  <label title="编辑后自动重新运行"><input type="checkbox" id="auto"> 自动刷新</label>
  <select id="ex" title="内置示例"></select>
  <span title="双击源码里的函数名切换断点；函数每次返回时在这里暂停，F9 继续（含 JS 函数名如 circle / log）">双击函数名：断点 · F8 继续 · 画布上悬停/右键：取源 · 数字上滚轮：微调</span>
  <span id="status"></span>
</header>
<main>
  <section id="left">
    <div class="tab"><b id="tabname" title="双击改名（Ctrl+S 总是覆盖同名文件）">sketch.lisp</b></div>
    <details id="tp"><summary>Tweak <span id="tpn"></span><select id="tppre" title="预设：选择即把一组参数值写回源码；改了值就回到【当前预设】"></select></summary>
      <div id="tpbar"><input id="tpimp" placeholder="粘贴单个预设 JSON 导入" title="粘贴单个预设的单行 JSON 即导入"><button id="tpexp" title="把当前这一套参数值导出为单行 JSON（复制到剪贴板）">导出</button><span id="tplinks"></span></div>
      <div id="tprows"></div>
      <details id="tphead" hidden><summary>推断的 (tweak) 声明 <span id="tphn"></span></summary><pre id="tphpre"></pre><button id="tphput" title="把这些声明写进源码顶部：之后就是你的声明，可以改">写入源码顶部</button></details>
    </details>
    <pre id="src" class="ed"></pre>
    <div id="split" title="拖动调整编辑器 / 控制台"></div>
    <div id="con"><div class="hd">Console <button id="clr">清空</button></div><div id="out"></div></div>
  </section>
  <section id="right">
    <div class="tab" id="rtab"><b>Preview</b>
      <button id="fbn" title="帧缓冲：保留最近 N 帧的画布与内存快照。点击：在源码里补 [frameBuffer N]，再用滚轮调大小">缓冲：未开启</button>
      <div id="fb" tabindex="0" title="点击读取那一帧（←/→ 逐帧，Esc 回到实时）"><i></i><u></u></div>
      <button id="fblive" hidden>● 实时</button>
    </div>
    <div id="fbinfo" hidden></div>
    <div id="pv"></div>
  </section>
</main>
<div id="ov"><svg><g></g></svg><div id="mks"></div></div>
<script src="https://cdn.jsdelivr.net/npm/p5@1.9.4/lib/p5.min.js"></script>
<script src="parse.js"></script>
<script src="lisp.js"></script>
<script src="ui/editor.js"></script>
<script src="ui/sloc.js"></script>
<script src="ui/xref.js"></script>
<script src="ui/console.js"></script>
<script src="ui/debug.js"></script>
<script src="ui/pause.js"></script>
<script src="ui/session.js"></script>
<script src="ui/explorer.js"></script>
<script src="p5/exec.js"></script>
<script src="p5/tweak.js"></script>
<script src="p5/pane.js"></script>
<script src="p5/pick.js"></script>
<script src="p5/fbuf.js"></script>
<script src="p5/app.js"></script>
</body>
</html>
